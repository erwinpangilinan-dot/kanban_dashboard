# Direct access: LAN and localhost, published as port 80 on the host.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Callers on this listener are not trusted to describe themselves, so
    # forwarding headers they send are ignored in favour of the real peer.
    set $client_proto $scheme;

    include /etc/nginx/conf.d/app-locations.inc;
}

# Cloudflare Tunnel only. This port is never published to the host, so the
# cloudflared container is the only thing that can reach it — which is what
# makes the headers below safe to trust. Do not add it to compose `ports`.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Cloudflare puts the real visitor address in CF-Connecting-IP. Trusting it
    # here rewrites $remote_addr to the actual client so logs and the API's
    # login rate limiter see individual visitors rather than one shared tunnel
    # address. The ranges below cover the Docker network the tunnel connects
    # from; no other peer can reach this listener.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # TLS terminates at Cloudflare, so the visitor's scheme is always https
    # even though this hop is plain HTTP. The OAuth callback relies on this to
    # build https redirect URIs and set Secure cookies.
    set $client_proto https;

    include /etc/nginx/conf.d/app-locations.inc;
}
